name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.13'
      - name: Build Android release
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-apk
      - name: Verify tag and sign APK
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager "build-tools;35.0.0"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          version=$("$tools/aapt" dump badging app-release-unsigned.apk | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag must match the APK versionName." >&2
            exit 1
          fi
          : "${ANDROID_KEYSTORE_BASE64:?Configure Android signing secrets}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure Android signing secrets}"
          : "${ANDROID_KEY_ALIAS:?Configure Android signing secrets}"
          : "${ANDROID_KEY_PASSWORD:?Configure Android signing secrets}"
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          apk="quietledger-$version.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" app-release-unsigned.apk
          "$tools/apksigner" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          apk="quietledger-${RELEASE_TAG#v}.apk"
          gh release create "$RELEASE_TAG" "$apk" "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
